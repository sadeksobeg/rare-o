<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>حسابي — RARE OUD (نموذج مرحلة 2)</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .tr-header { background: linear-gradient(105deg, var(--plum-900) 0%, var(--ink-950) 58%, var(--ink-900) 100%); color: var(--text-inverse); padding: var(--s-3) var(--s-6); display: flex; justify-content: space-between; align-items: center; }
  .tr-main { padding: var(--s-6) var(--s-8); max-width: 560px; margin: 0 auto; }
</style>
</head>
<body>
  <header class="tr-header">
    <div style="font-family:var(--font-ar-display);font-weight:700">RARE OUD</div>
    <button class="lang-toggle" onclick="roToggleLang()">EN</button>
  </header>
  <main class="tr-main">
    <h1><span data-lang="ar">حسابي</span><span data-lang="en" hidden>My account</span></h1>
    <div class="card" style="margin-bottom:var(--s-4)">
      <h2><span data-lang="ar">بيانات الحساب</span><span data-lang="en" hidden>Account details</span></h2>
      <p class="muted" style="font-size:.88rem"><bdi>trader@rareoud.local</bdi><br/><span data-lang="ar">يُنشأ ويُعدَّل من الإدارة فقط</span><span data-lang="en" hidden>Created and edited by admin only</span></p>
    </div>
    <div class="card">
      <h2><span data-lang="ar">تفضيلات الاهتمام</span><span data-lang="en" hidden>Interest preferences</span></h2>
      <p class="muted" style="font-size:.85rem"><span data-lang="ar">الفئات التي تهمّك لمطابقة الصفقات المناسبة</span><span data-lang="en" hidden>Categories you're interested in, to match suitable deals</span></p>
      <div class="field"><label><span data-lang="ar">الفئات</span><span data-lang="en" hidden>Categories</span></label>
        <select multiple size="3"><option selected><bdi>آلات موسيقية وترية</bdi></option><option><bdi>إكسسوارات</bdi></option></select>
      </div>
      <button class="btn btn-primary"><span data-lang="ar">حفظ</span><span data-lang="en" hidden>Save</span></button>
    </div>
  </main>
<script src="shared.js"></script>
</body>
</html>
