name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Re-run Caddy TLS smoke only (app must already listen on host :3000):
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://rareoud:rareoud@localhost:5432/rareoud?schema=public
  AUTH_SECRET: ci-auth-secret-min-16-chars
  WHATSAPP_BUSINESS_E164: "963900000000"
  ADMIN_EMAIL: admin@rareoud.local
  ADMIN_PASSWORD: ChangeMeNow!
  TRADER_EMAIL: trader@rareoud.local
  TRADER_PASSWORD: ChangeMeNow!
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  CI: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rareoud
          POSTGRES_PASSWORD: rareoud
          POSTGRES_DB: rareoud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rareoud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers (chromium, firefox, webkit + deps)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright install --with-deps chrome

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prisma generate & migrate
        run: |
          npm run db:generate
          npm run db:migrate

      - name: Unit checks (E2)
        run: npm run test:e2-unit

      - name: Week 3 regression
        run: npm run db:seed && npm run test:week3

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Seed database for runtime tests
        run: |
          npm run db:seed
          npm run db:seed:demo

      - name: Start Next.js on port 3000
        run: |
          npm run start &
          echo $! > /tmp/next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Next.js ready on :3000"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to become ready"
          exit 1
        env:
          NODE_ENV: production
          PORT: "3000"

      - name: Caddy TLS internal smoke
        run: bash scripts/ci-caddy-smoke.sh

      - name: E2E all Playwright projects (3 consecutive runs)
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "========== E2E stability run ${run}/3 =========="
            npm run test:e2e -- --reporter=list --reporter=html
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Lighthouse budget (5-run median)
        # F2: fail CI when storefront medians stay below 0.85 — keep soft until perf fixes land.
        continue-on-error: true
        run: npm run test:lh-budget
        env:
          LH_RUNS: "5"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Upload Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: docs/pro-readiness/LIGHTHOUSE.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then
            kill "$(cat /tmp/next.pid)" 2>/dev/null || true
          fi

      - name: Docker build (npmjs registry only)
        run: |
          docker build \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org \
            --build-arg DATABASE_URL="${DATABASE_URL}" \
            -t rare-oud-platform:ci .

      - name: Security audit (fail on high/critical)
        run: npm run security:audit

# workflow_dispatch re-runs the full pipeline above (including Caddy via scripts/ci-caddy-smoke.sh).
# Local-only Caddy check: start `npm run start` on :3000, then `bash scripts/ci-caddy-smoke.sh`.
