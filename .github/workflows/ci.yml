# Full CI — push to master/main + manual dispatch only (heavy; private minutes).
name: CI

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://rareoud:rareoud@localhost:5432/rareoud?schema=public
  AUTH_SECRET: ci-auth-secret-min-16-chars
  WHATSAPP_BUSINESS_E164: "963900000000"
  ADMIN_EMAIL: admin@rareoud.local
  ADMIN_PASSWORD: ChangeMeNow!
  TRADER_EMAIL: trader@rareoud.local
  TRADER_PASSWORD: ChangeMeNow!
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  CI: true
  SITE_URL: https://ci.example.com
  SECURITY_EMAIL: security@ci.example.com
  REQUIRE_SITE_ENV: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rareoud
          POSTGRES_PASSWORD: rareoud
          POSTGRES_DB: rareoud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rareoud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright install --with-deps chrome

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prisma generate & migrate
        run: |
          npm run db:generate
          npm run db:migrate

      - name: Unit checks (E2)
        run: npm run test:e2-unit

      - name: Week 3 regression
        run: npm run db:seed && npm run test:week3

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: SBOM (CycloneDX)
        run: npm run sbom

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cdx
          path: docs/pro-readiness/SBOM.cdx.json
          if-no-files-found: ignore
          retention-days: 14

      - name: F5 contracts + coverage + security
        run: |
          npm run test:f5-contracts
          npm run test:f5-coverage
          npm run test:f5-security
          npm run test:f5-visual
          npm run test:f3-2fa
          npm run test:f3-upload

      - name: Seed database for runtime tests
        run: |
          npm run db:seed
          npm run db:seed:demo

      - name: Start Next.js on port 3000
        run: |
          npm run start &
          echo $! > /tmp/next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Next.js ready on :3000"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to become ready"
          exit 1
        env:
          NODE_ENV: production
          PORT: "3000"

      - name: Caddy TLS internal smoke
        run: bash scripts/ci-caddy-smoke.sh

      - name: E2E all Playwright projects (3 consecutive runs)
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "========== E2E stability run ${run}/3 =========="
            npm run test:e2e -- --reporter=list --reporter=html
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Visual regression
        run: npm run test:e2e -- e2e/visual-regression.spec.ts --reporter=list
        continue-on-error: false

      - name: Lighthouse budget (5-run median ≥0.85 HARD GATE)
        run: npm run test:lh-budget
        env:
          LH_RUNS: "5"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          LH_THRESHOLD: "0.85"

      - name: Upload Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: docs/pro-readiness/LIGHTHOUSE.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then
            kill "$(cat /tmp/next.pid)" 2>/dev/null || true
          fi

      - name: Docker build (npmjs registry only)
        run: |
          docker build \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org \
            --build-arg DATABASE_URL="${DATABASE_URL}" \
            -t rare-oud-platform:ci .

      - name: Security audit (fail on high/critical)
        run: npm run security:audit
