# Rare Oud — host nginx reverse proxy → 127.0.0.1:3010
# Install:
#   sudo cp deploy/nginx-rareoud.com.conf /etc/nginx/sites-available/rareoud.com
#   sudo ln -sf /etc/nginx/sites-available/rareoud.com /etc/nginx/sites-enabled/rareoud.com
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (after DNS A points here):
#   sudo certbot --nginx -d rareoud.com -d www.rareoud.com

upstream rareoud_next {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name rareoud.com www.rareoud.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://rareoud.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rareoud.com www.rareoud.com;

    if ($host = www.rareoud.com) {
        return 301 https://rareoud.com$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/rareoud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rareoud.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    /* Security headers (HSTS, XFO, XCTO, Referrer-Policy, Permissions-Policy)
       are set only by Next.js next.config.ts — do not duplicate here.
       A previous nginx Permissions-Policy: microphone=() blocked the inbox mic. */

    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /_next/static/ {
        proxy_pass http://rareoud_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin inbox SSE — disable buffering; honor upstream X-Accel-Buffering: no
    location /api/admin/inbox/events {
        proxy_pass http://rareoud_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;
    }

    location / {
        proxy_pass http://rareoud_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
