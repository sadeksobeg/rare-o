services:
  postgres:
    image: postgres:16-alpine
    container_name: rare-oud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rareoud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rareoud}
      POSTGRES_DB: ${POSTGRES_DB:-rareoud}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rare_oud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rare_oud_pgdata:
