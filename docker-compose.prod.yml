# Production stack — isolated Rare Oud on shared VPS.
# Usage:
#   cp .env.production.example .env.production   # fill secrets + DOMAIN
#   docker compose -f docker-compose.prod.yml --env-file .env.production config
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Host isolation (plan):
#   code: /srv/rareoud
#   data: /var/lib/rareoud/{media,wa-auth,pg,backups}
#   loopback only: 127.0.0.1:3010 → nginx vhost rareoud.com

name: rare-oud-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rareoud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rareoud}
    volumes:
      - /var/lib/rareoud/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rareoud

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Host network: next/font Google fetch fails in bridge (empty CSS / null parse).
      network: host
      args:
        SITE_URL: https://${DOMAIN:?set DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        SECURITY_EMAIL: ${SECURITY_EMAIL:-security@${DOMAIN}}
    image: rare-oud-web:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rareoud}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rareoud}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rareoud.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-RARE OUD Admin}
      WHATSAPP_BUSINESS_E164: ${WHATSAPP_BUSINESS_E164:-}
      WHATSAPP_AUTH_DIR: /app/.wa-auth
      WHATSAPP_ADAPTER: ${WHATSAPP_ADAPTER:-baileys}
      WHATSAPP_CONNECT_ON_START: "false"
      WHATSAPP_OUTBOUND_ENABLED: ${WHATSAPP_OUTBOUND_ENABLED:-false}
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?set DOMAIN}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - /var/lib/rareoud/media/public:/app/public/uploads
      - /var/lib/rareoud/media/storage:/app/storage/uploads
      - /var/lib/rareoud/wa-auth:/app/.wa-auth
    # Loopback only — host nginx terminates TLS for rareoud.com
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3010}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks:
      - rareoud

  worker:
    image: rare-oud-web:prod
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rareoud}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rareoud}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      WHATSAPP_AUTH_DIR: /app/.wa-auth
      WHATSAPP_ADAPTER: ${WHATSAPP_ADAPTER:-baileys}
      WHATSAPP_CONNECT_ON_START: ${WHATSAPP_CONNECT_ON_START:-false}
      WHATSAPP_OUTBOUND_ENABLED: ${WHATSAPP_OUTBOUND_ENABLED:-false}
      NODE_ENV: production
    volumes:
      - /var/lib/rareoud/media/public:/app/public/uploads
      - /var/lib/rareoud/media/storage:/app/storage/uploads
      - /var/lib/rareoud/wa-auth:/app/.wa-auth
    command: ["node", "node_modules/tsx/dist/cli.mjs", "worker/whatsapp-worker.ts"]
    # Image HEALTHCHECK hits Next /api/health; worker does not serve HTTP.
    healthcheck:
      disable: true
    networks:
      - rareoud

  caddy:
    # Optional standalone TLS — NOT used when host nginx already owns 80/443.
    # Enable only if ports are free: docker compose … --profile tls up
    profiles: ["tls"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - rare_oud_caddy_data:/data
      - rare_oud_caddy_config:/config
    networks:
      - rareoud

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-rareoud}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-rareoud}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ROOT: /backups
    volumes:
      - /var/lib/rareoud/media/public:/uploads:ro
      - /var/lib/rareoud/media/storage:/uploads-storage:ro
      - /var/lib/rareoud/wa-auth:/wa-auth:ro
      - /var/lib/rareoud/backups:/backups
      - ./deploy/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    networks:
      - rareoud

volumes:
  rare_oud_caddy_data:
  rare_oud_caddy_config:

networks:
  rareoud:
    driver: bridge
