# Off-site backup proof stack (F4). Use with:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d minio
# Then: npm run test:f4-backup-drill

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: rare-oud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rare_oud_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: ["backup", "staging"]

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/rare-oud-backups || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    profiles: ["backup", "staging"]

volumes:
  rare_oud_minio:
